<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>{% block title %}Card Block — Instant Bank Card Blocking{% endblock %}</title>
 <meta name="description" content="Find lost/stolen credit & debit card blocking numbers for 115+ Indian banks. Search by bank name, get toll-free numbers instantly.">
 <meta name="keywords" content="block credit card, block debit card, lost card, stolen card, bank toll free number, Indian banks, card blocking, HDFC, SBI, ICICI">
 <meta name="robots" content="index, follow">
 <meta name="author" content="Cashless Consumer">
 <link rel="canonical" href="https://cardblock.cashlessconsumer.in{{ request.path }}">

 <!-- Open Graph -->
 <meta property="og:type" content="website">
 <meta property="og:title" content="{% block og_title %}Card Block — Instant Bank Card Blocking{% endblock %}">
 <meta property="og:description" content="Find card blocking numbers for 115+ Indian banks instantly.">
 <meta property="og:url" content="https://cardblock.cashlessconsumer.in{{ request.path }}">
 <meta property="og:site_name" content="Card Block">

 <!-- Twitter Card -->
 <meta name="twitter:card" content="summary">
 <meta name="twitter:title" content="{% block twitter_title %}Card Block{% endblock %}">

 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
 <style>
 /* ── Flash prevention: apply saved theme before render ── */
 (function(){var t=localStorage.getItem('theme');if(t){document.documentElement.setAttribute('data-theme',t)}})();

 /* ══════════════════════════════════════
    Light+ Theme (default)
    ══════════════════════════════════════ */
 :root,
 [data-theme="light"] {
 --ink: #0f172a;
 --muted: #475569;
 --subtle: #94a3b8;
 --border: #e2e8f0;
 --surface: #f8fafc;
 --bg: #f1f5f9;
 --card: #ffffff;
 --primary: #0ea5e9;
 --primary-dark: #0284c7;
 --primary-50: #f0f9ff;
 --primary-100: #e0f2fe;
 --success: #10b981;
 --success-bg: #ecfdf5;
 --success-border: #a7f3d0;
 --success-text: #065f46;
 --success-hover: #d1fae5;
 --danger: #ef4444;
 --danger-bg: #fef2f2;
 --danger-text: #7f1d1d;
 --nav-bg: #0f172a;
 --hero-bg: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
 --radius: 12px;
 --radius-lg: 16px;
 --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 1px rgba(0,0,0,0.04);
 --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.08), 0 4px 10px -5px rgba(0,0,0,0.04);
 --font: 'Inter', system-ui, -apple-system, sans-serif;
 --header-h: 64px;
 }

 /* ══════════════════════════════════════
    Dark+ Theme
    ══════════════════════════════════════ */
 [data-theme="dark"] {
 --ink: #e2e8f0;
 --muted: #94a3b8;
 --subtle: #64748b;
 --border: #1e293b;
 --surface: #1e293b;
 --bg: #0f172a;
 --card: #1e293b;
 --primary-50: #1e3a5f;
 --primary-100: #162d4a;
 --success-bg: #064e3b;
 --success-border: #065f46;
 --success-text: #6ee7b7;
 --success-hover: #065f46;
 --danger-bg: #450a0a;
 --danger-text: #fca5a5;
 --nav-bg: #020617;
 --hero-bg: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
 --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 1px rgba(0,0,0,0.2);
 --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.4), 0 4px 10px -5px rgba(0,0,0,0.3);
 }

 *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

 html { overflow-x: hidden; }

 body {
 font-family: var(--font);
 background: var(--bg);
 color: var(--ink);
 -webkit-font-smoothing: antialiased;
 min-height: 100vh;
 display: flex;
 flex-direction: column;
 transition: background 0.3s, color 0.3s;
 overflow-x: hidden;
 }

 /* ===== Top Nav Bar ===== */
 .topnav {
 position: sticky; top: 0; z-index: 100;
 background: var(--nav-bg);
 height: var(--header-h);
 display: flex;
 align-items: center;
 padding: 0 16px;
 gap: 16px;
 }

 .topnav-brand {
 display: flex;
 align-items: center;
 gap: 10px;
 text-decoration: none;
 color: #fff;
 flex-shrink: 0;
 }

 .topnav-brand .icon {
 width: 32px; height: 32px;
 background: var(--primary);
 border-radius: 8px;
 display: flex;
 align-items: center;
 justify-content: center;
 }

 .topnav-brand .icon svg { width: 18px; height: 18px; }

 .topnav-brand span {
 font-size: 17px;
 font-weight: 800;
 letter-spacing: -0.02em;
 }

 /* Desktop nav links */
 .topnav-links {
 display: none;
 gap: 4px;
 margin-left: 16px;
 }

 @media (min-width: 768px) {
 .topnav { padding: 0 24px; gap: 20px; }
 .topnav-links { display: flex; }
 .hamburger { display: none !important; }
 }

 .topnav-link {
 color: var(--subtle);
 text-decoration: none;
 font-size: 14px;
 font-weight: 500;
 padding: 8px 14px;
 border-radius: 8px;
 transition: all 0.15s;
 white-space: nowrap;
 }

 .topnav-link:hover { color: #fff; background: rgba(255,255,255,0.08); }
 .topnav-link.active { color: #fff; background: var(--primary); }

 /* Hamburger button (mobile only) */
 .hamburger {
 display: flex;
 align-items: center;
 justify-content: center;
 background: none;
 border: none;
 color: #fff;
 cursor: pointer;
 padding: 8px;
 border-radius: 8px;
 transition: background 0.15s;
 }
 .hamburger:hover { background: rgba(255,255,255,0.08); }
 .hamburger svg { width: 22px; height: 22px; }

 .topnav-spacer { flex: 1; }

 .topnav-right {
 display: flex;
 align-items: center;
 gap: 8px;
 flex-shrink: 0;
 }

 .topnav-stat {
 font-size: 12px;
 color: var(--subtle);
 display: none;
 }

 @media (min-width: 768px) {
 .topnav-stat { display: block; }
 .topnav-right { gap: 12px; }
 }

 /* Mobile slide-down menu */
 .mobile-menu {
 display: none;
 position: fixed;
 top: var(--header-h);
 left: 0; right: 0;
 background: var(--nav-bg);
 border-top: 1px solid rgba(255,255,255,0.08);
 z-index: 99;
 padding: 12px 16px;
 flex-direction: column;
 gap: 4px;
 box-shadow: var(--shadow-lg);
 }

 .mobile-menu.open { display: flex; }

 .mobile-menu .topnav-link {
 display: block;
 padding: 12px 16px;
 font-size: 15px;
 border-radius: 8px;
 }

 @media (min-width: 768px) {
 .mobile-menu { display: none !important; }
 }

 /* ===== Main Layout ===== */
 .page-container {
 flex: 1;
 display: flex;
 flex-direction: column;
 }

 .content {
 width: 100%;
 max-width: 1200px;
 margin: 0 auto;
 padding: 16px;
 }

 @media (min-width: 768px) {
 .content { padding: 32px 40px; }
 }

 /* ===== Footer ===== */
 .footer {
 background: var(--nav-bg);
 color: var(--subtle);
 padding: 20px 16px;
 font-size: 13px;
 display: flex;
 flex-wrap: wrap;
 align-items: center;
 gap: 12px;
 justify-content: space-between;
 }

 @media (min-width: 768px) {
 .footer { padding: 20px 24px; gap: 16px; }
 }

 .footer a { color: var(--primary); text-decoration: none; }
 .footer a:hover { text-decoration: underline; }

 .footer-badge {
 display: inline-flex;
 align-items: center;
 gap: 6px;
 padding: 4px 10px;
 border-radius: 999px;
 background: rgba(255,255,255,0.06);
 border: 1px solid rgba(255,255,255,0.08);
 font-size: 12px;
 }

 .footer-links {
 display: flex;
 gap: 16px;
 }

 /* ===== Utility ===== */
 .badge {
 display: inline-flex;
 align-items: center;
 gap: 3px;
 font-size: 11px;
 font-weight: 600;
 padding: 2px 7px;
 border-radius: 999px;
 background: var(--success-bg);
 color: var(--success-text);
 }

 .badge svg { width: 10px; height: 10px; }

 .spinner {
 width: 32px; height: 32px;
 border: 3px solid var(--border);
 border-top-color: var(--primary);
 border-radius: 50%;
 animation: spin 0.7s linear infinite;
 margin: 0 auto 12px;
 }

 @keyframes spin { to { transform: rotate(360deg); } }

 /* ===== Theme Toggle ===== */
 .theme-toggle-btn {
 background: rgba(255,255,255,0.1);
 border: none;
 border-radius: 8px;
 width: 36px; height: 36px;
 display: flex; align-items: center; justify-content: center;
 cursor: pointer;
 color: var(--subtle);
 transition: all 0.15s;
 position: relative;
 overflow: hidden;
 flex-shrink: 0;
 }
 .theme-toggle-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
 .theme-toggle-btn svg { transition: transform 0.3s, opacity 0.3s; position: absolute; }
 #icon-sun { opacity: 0; transform: rotate(90deg) scale(0.5); }
 [data-theme="dark"] #icon-moon { opacity: 0; transform: rotate(-90deg) scale(0.5); }
 [data-theme="dark"] #icon-sun { opacity: 1; transform: rotate(0deg) scale(1); }
 @media (prefers-color-scheme: dark) {
 #icon-sun { opacity: 1; transform: rotate(0deg) scale(1); }
 #icon-moon { opacity: 0; transform: rotate(-90deg) scale(0.5); }
 }

 /* Card / component backgrounds — dark mode auto-override via --card var */
 .bank-card,
 .quick-action,
 .bin-result-card,
 .stat-card,
 .license-box {
 background: var(--card);
 }

 .filter-bar {
 background: var(--card);
 color: var(--ink);
 }

 .call-card {
 background: var(--success-bg);
 }
 .call-primary:hover { background: var(--success-hover); }
 .call-alt:hover { background: var(--success-hover); }

 .notice-box {
 background: var(--danger-bg);
 border-left-color: var(--danger);
 }
 .notice-box h3 { color: var(--danger); }
 .notice-box p { color: var(--danger-text); }

 .cta-box {
 background: var(--nav-bg);
 }
 </style>
 {% block extra_head %}{% endblock %}
</head>
<body>

<nav class="topnav">
 <a href="/" class="topnav-brand">
 <div class="icon">
 <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="3"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
 </div>
 <span>Card Block</span>
 </a>

 <div class="topnav-links">
 <a href="/" class="topnav-link {% block nav_home %}{% endblock %}">Banks</a>
 <a href="/bins" class="topnav-link {% block nav_bins %}{% endblock %}">BIN Lookup</a>
 <a href="/about" class="topnav-link {% block nav_about %}{% endblock %}">About</a>
 <a href="/disclaimer" class="topnav-link {% block nav_disclaimer %}{% endblock %}">Disclaimer</a>
 </div>

 <div class="topnav-spacer"></div>

 <div class="topnav-right">
 <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle dark mode" title="Toggle theme">
 <svg id="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
 <svg id="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
 </button>
 <span class="topnav-stat" id="nav-bank-count"></span>
 <span class="topnav-stat" id="nav-updated"></span>

 <!-- Hamburger (mobile only) -->
 <button class="hamburger" id="hamburger-btn" aria-label="Open menu">
 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
 </button>
 </div>
</nav>

<!-- Mobile slide-down menu -->
<div class="mobile-menu" id="mobile-menu">
 <a href="/" class="topnav-link {% block nav_home_m %}{% endblock %}">Banks</a>
 <a href="/bins" class="topnav-link {% block nav_bins_m %}{% endblock %}">BIN Lookup</a>
 <a href="/about" class="topnav-link {% block nav_about_m %}{% endblock %}">About</a>
 <a href="/disclaimer" class="topnav-link {% block nav_disclaimer_m %}{% endblock %}">Disclaimer</a>
</div>

<main class="page-container">
 {% block content %}{% endblock %}
</main>

<footer class="footer">
 <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
 <span>© 2026 <a href="https://cashlessconsumer.in">Cashless Consumer</a></span>
 <span class="footer-badge">
 <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
 Open Data · MIT License
 </span>
 </div>
 <div class="footer-links">
 <a href="/about">About</a>
 <a href="/disclaimer">Disclaimer</a>
 <a href="/api/v1/export/json" target="_blank">API</a>
 <a href="https://github.com/CCAgentOrg/card-block-api" target="_blank">GitHub</a>
 </div>
</footer>

<!-- Common JS -->
<script defer src="/static/app.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script>
// ── Theme Toggle ──
(function() {
 var html = document.documentElement;
 // Respect OS preference if no saved theme
 var stored = localStorage.getItem('theme');
 if (!stored) {
 stored = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
 }
 html.setAttribute('data-theme', stored);

 function setTheme(t) {
 html.setAttribute('data-theme', t);
 localStorage.setItem('theme', t);
 }

 var btn = document.getElementById('theme-toggle');
 if (btn) {
 btn.addEventListener('click', function() {
 setTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
 });
 }

 // Listen for OS changes
 window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
 if (!localStorage.getItem('theme')) {
 setTheme(e.matches ? 'dark' : 'light');
 }
 });
})();

// ── Mobile hamburger menu ──
(function() {
 var hamBtn = document.getElementById('hamburger-btn');
 var menu = document.getElementById('mobile-menu');
 if (hamBtn && menu) {
 hamBtn.addEventListener('click', function() {
 menu.classList.toggle('open');
 });
 // Close menu when a link is clicked
 menu.querySelectorAll('.topnav-link').forEach(function(link) {
 link.addEventListener('click', function() {
 menu.classList.remove('open');
 });
 });
 // Close menu when clicking outside
 document.addEventListener('click', function(e) {
 if (!menu.contains(e.target) && !hamBtn.contains(e.target)) {
 menu.classList.remove('open');
 }
 });
 }
})();

// Fetch stats for nav bar
(async () => {
 try {
 const res = await fetch('/api/v1/banks/');
 if (res.ok) {
 const banks = await res.json();
 const el = document.getElementById('nav-bank-count');
 if (el) el.textContent = banks.length + ' banks';
 const updated = document.getElementById('nav-updated');
 if (updated && banks[0]?.lastVerified) {
 updated.textContent = 'Updated ' + banks[0].lastVerified;
 }
 }
 } catch(e) {}
})();
</script>

{% block extra_scripts %}{% endblock %}
</body>
</html>
