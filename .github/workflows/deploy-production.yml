name: Deploy — production

on:
  push:
    branches: [main, master]
    paths-ignore: ['*.md', 'docs/**', '.github/**']

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy-production:
    name: Deploy to production (Fly.io)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions@master
        with:
          accessToken: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy
        run: fly deploy --app cardblockapi --remote-only

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -so /dev/null -w "%{http_code}" "https://cardblockapi.fly.dev/api/v1/banks") && break || sleep 10
          done
          echo "Status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1
