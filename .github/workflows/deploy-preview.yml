name: Build & Deploy

on:
  push:
    branches: ['feature/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ['dev', 'main']

concurrency:
  group: deploy-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    outputs:
      url: ${{ steps.preview-url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions@master
        with:
          accessToken: ${{ secrets.FLY_API_TOKEN }}

      - name: Create ephemeral app
        run: |
          fly apps create "cardblock-pr-${{ github.event.pull_request.number }}" 2>/dev/null || true

      - name: Generate fly.toml
        run: |
          cat > fly-preview.toml <<HEREDOC
          app = "cardblock-pr-${{ github.event.pull_request.number }}"
          primary_region = "iad"

          [build]

          [env]
            FLASK_RUN_HOST = "0.0.0.0"
            FLASK_RUN_PORT = "8080"
            ENVIRONMENT = "preview"

          [http_service]
            internal_port = 8080
            force_https = true
            auto_stop_machines = "stop"
            auto_start_machines = true
            min_machines_running = 0

          [[vm]]
            size = "shared-cpu-1x"
            memory = "256mb"
          HEREDOC

      - name: Deploy
        run: fly deploy -c fly-preview.toml --remote-only --detach

      - id: preview-url
        run: echo "url=https://cardblock-pr-${{ github.event.pull_request.number }}.fly.dev" >> $GITHUB_OUTPUT

  comment:
    name: Post Preview Link
    runs-on: ubuntu-latest
    needs: preview
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const n = context.issue.number;
            github.rest.issues.createComment({
              issue_number: n,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `\ud83d\ude80 **Preview:** https://cardblock-pr-${n}.fly.dev\n\nEphemeral Fly.io app.`
            });

  cleanup:
    name: Destroy Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    steps:
      - uses: superfly/flyctl-actions@master
        with:
          accessToken: ${{ secrets.FLY_API_TOKEN }}
      - run: |
          APP="cardblock-pr-${{ github.event.pull_request.number }}"
          fly apps destroy "$APP" -y 2>/dev/null || true
