name: Build & Deploy

on:
  push:
    branches: ['feature/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ['dev', 'main']

concurrency:
  group: deploy-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    outputs:
      url: ${{ steps.preview-url.outputs.url }}
      app: cardblock-pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - name: Create ephemeral app
        uses: superfly/flyctl-actions/setup-flyctl@v1.5
      - run: >
          fly apps create cardblock-pr-${{ github.event.pull_request.number }}
          --org personal 2>/dev/null || true

      - name: Generate fly.toml for preview
        run: |
          cat <<TOML > fly-preview.toml
          app = "cardblock-pr-${{ github.event.pull_request.number }}"
          primary_region = "iad"

          [build]

          [env]
            FLASK_RUN_HOST = "0.0.0.0"
            FLASK_RUN_PORT = "8080"
            ENVIRONMENT = "preview"
            PR_NUMBER = "${{ github.event.pull_request.number }}"

          [http_service]
            internal_port = 8080
            force_https = true
            auto_stop_machines = "stop"
            auto_start_machines = true
            min_machines_running = 0

          [[vm]]
            size = "shared-cpu-1x"
            memory = "256mb"
          TOML

      - name: Deploy preview
        run: fly deploy -c fly-preview.toml --remote-only --detach

      - name: Set preview URL
        id: preview-url
        run: echo "url=https://cardblock-pr-${{ github.event.pull_request.number }}.fly.dev" >> $GITHUB_OUTPUT

  comment:
    name: Post Preview Link
    runs-on: ubuntu-latest
    needs: preview
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const app = "cardblock-pr-${{ github.event.pull_request.number }}";
            const url = `https://${app}.fly.dev`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview deployed**: ${url}\n\nThis PR is running on an ephemeral Fly.io machine. It will auto-sleep after inactivity.`
            });

  cleanup:
    name: Destroy Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@v1.5
      - run: |
          APP="cardblock-pr-${{ github.event.pull_request.number }}"
          echo "Destroying preview app: $APP"
          fly apps destroy "$APP" -y 2>/dev/null || echo "App $APP not found or already destroyed"
