name: Build & Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev, main]

concurrency:
  group: deploy-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Create ephemeral app
        run: |
          APP="cardblock-pr-${{ github.event.pull_request.number }}"
          fly apps create "$APP" 2>/dev/null || echo "App already exists"

      - name: Write fly.toml
        run: |
          cat > fly-preview.toml <<TOML
          app = "cardblock-pr-${{ github.event.pull_request.number }}"
          primary_region = "iad"

          [build]

          [env]
            FLASK_RUN_HOST = "0.0.0.0"
            FLASK_RUN_PORT = "8080"
            ENVIRONMENT = "preview"

          [http_service]
            internal_port = 8080
            force_https = true
            auto_stop_machines = "stop"
            auto_start_machines = true
            min_machines_running = 0

          [[vm]]
            size = "shared-cpu-1x"
            memory = "256mb"
          TOML

      - name: Deploy
        run: fly deploy -c fly-preview.toml --detach

      - id: preview-url
        run: echo "url=https://cardblock-pr-${{ github.event.pull_request.number }}.fly.dev" >> "$GITHUB_OUTPUT"

  comment:
    name: Post Preview Link
    runs-on: ubuntu-latest
    needs: preview
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const n = context.issue.number;
            github.rest.issues.createComment({
              issue_number: n,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `\ud83d\ude80 **Preview:** https://cardblock-pr-${n}.fly.dev\n\nEphemeral Fly.io app.`
            });

  cleanup:
    name: Destroy Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
      - run: |
          APP="cardblock-pr-${{ github.event.pull_request.number }}"
          fly apps destroy "$APP" -y 2>/dev/null || echo "Already destroyed"
