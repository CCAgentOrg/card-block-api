name: Data CI

on:
  push:
    branches: [main, dev, 'feature/**']
    paths: ['data/**', 'scripts/**', '.github/workflows/data-ci.yml']
  pull_request:
    branches: [main, dev]
    paths: ['data/**', 'scripts/**', '.github/workflows/data-ci.yml']
  workflow_dispatch:

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate per-bank JSON files
        run: node scripts/validate-data.js

      - name: Rebuild data layer and detect drift
        run: |
          node scripts/build-data-layer.js
          if [ -n "$(git status --porcelain data/banks)" ]; then
            echo "::error::data/banks is out of sync with app/data/banks.json — run 'node scripts/build-data-layer.js' and commit"
            git status --porcelain data/banks
            exit 1
          fi
          echo "data layer in sync"
