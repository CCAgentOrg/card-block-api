name: Deploy — dev

on:
  push:
    branches: [dev]

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Create app if missing
        run: |
          fly apps create cardblockapi-dev 2>/dev/null || echo "App already exists"

      - name: Deploy
        run: fly deploy -c fly.dev.toml --app cardblockapi-dev --detach

      - name: Health check
        run: |
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -so /dev/null -w "%{http_code}" "https://cardblockapi-dev.fly.dev/api/v1/banks") && break || sleep 10
          done
          echo "Status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1
